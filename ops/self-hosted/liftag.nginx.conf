server {
    listen 80;
    listen [::]:80;
    server_name liftag.fit www.liftag.fit;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.liftag.fit;
    ssl_certificate /etc/letsencrypt/live/liftag.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftag.fit/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://liftag.fit$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name liftag.fit;
    ssl_certificate /etc/letsencrypt/live/liftag.fit/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liftag.fit/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/liftag-web-realip.conf;
    access_log /var/log/nginx/liftag-site.access.log web_without_query;
    client_max_body_size 64k;
    root /opt/liftag-web/static/liftag/current;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;
    gzip_static on;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location ^~ /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
    }
    location ~ ^/(?:assets|uploads)/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, stale-while-revalidate=86400';
    }
    include /etc/nginx/snippets/liftag-web-analytics.conf;
    location / {
        proxy_pass http://liftag_web;
        include /etc/nginx/snippets/liftag-web-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $web_preserved_cache_control always;
    }
}
