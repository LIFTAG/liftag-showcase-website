location = /_analytics/script.js {
    proxy_pass http://127.0.0.1:3103/script.js;
    include /etc/nginx/snippets/liftag-web-proxy.conf;
    add_header Cache-Control 'public, max-age=3600';
}
location = /_analytics/api/send {
    limit_req zone=web_tracking burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:3103/api/send;
    include /etc/nginx/snippets/liftag-web-proxy.conf;
    add_header Cache-Control 'no-store' always;
}
location /_analytics/ { return 404; }
