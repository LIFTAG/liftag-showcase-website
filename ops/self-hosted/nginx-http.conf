# Definitions only; applied exclusively by the new website virtual hosts.
limit_req_zone $binary_remote_addr zone=web_leads:1m rate=3r/m;
limit_req_zone $binary_remote_addr zone=web_tracking:1m rate=120r/m;
log_format web_without_query '$remote_addr - $host [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
# Keep SSR HTML byte-for-byte intact across CDN transformations, including
# public mailto links and the markup React/Vue will hydrate.
map $upstream_http_cache_control $web_no_transform_cache_control {
    '' 'no-transform';
    default '$upstream_http_cache_control, no-transform';
}
map $upstream_http_content_type $web_preserved_cache_control {
    ~*^text/html $web_no_transform_cache_control;
    default $upstream_http_cache_control;
}
