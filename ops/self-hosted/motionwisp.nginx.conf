server {
    listen 80;
    listen [::]:80;
    server_name motionwisp.com www.motionwisp.com stats.motionwisp.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.motionwisp.com;
    ssl_certificate /etc/letsencrypt/live/motionwisp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motionwisp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://motionwisp.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name motionwisp.com;
    ssl_certificate /etc/letsencrypt/live/motionwisp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motionwisp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/liftag-web-realip.conf;
    access_log /var/log/nginx/motionwisp.access.log web_without_query;
    client_max_body_size 64k;
    root /opt/liftag-web/static/motionwisp/current;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_static on;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location ^~ /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control 'public, immutable';
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()';
    }
    location ^~ /media/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=604800, stale-while-revalidate=2592000';
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy strict-origin-when-cross-origin;
        add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()';
    }
    location = /api/lead {
        limit_req zone=web_leads burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://motionwisp_web;
        include /etc/nginx/snippets/liftag-web-proxy.conf;
    }
    location = /api/track {
        limit_req zone=web_tracking burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://motionwisp_web;
        include /etc/nginx/snippets/liftag-web-proxy.conf;
    }
    include /etc/nginx/snippets/liftag-web-analytics.conf;
    location / {
        proxy_pass http://motionwisp_web;
        include /etc/nginx/snippets/liftag-web-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $web_preserved_cache_control always;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.motionwisp.com;
    ssl_certificate /etc/letsencrypt/live/motionwisp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motionwisp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    include /etc/nginx/snippets/liftag-web-realip.conf;
    add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
    access_log /var/log/nginx/web-analytics.access.log web_without_query;
    client_max_body_size 64k;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / {
        proxy_pass http://127.0.0.1:3103;
        include /etc/nginx/snippets/liftag-web-proxy.conf;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $web_preserved_cache_control always;
        add_header X-Robots-Tag 'noindex, nofollow, noarchive' always;
    }
}
