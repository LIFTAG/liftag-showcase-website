<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LIFTAG gym-scan flow — Pivot Leg Press</title>
  <style>
    @font-face {
      font-family: Inter;
      font-style: normal;
      font-weight: 300 900;
      font-display: block;
      src: url("/new_app/public/assets/fonts/inter-latin.woff2") format("woff2");
    }
    @font-face {
      font-family: "Space Grotesk";
      font-style: normal;
      font-weight: 300 700;
      font-display: block;
      src: url("/new_app/public/assets/fonts/space-grotesk-latin.woff2") format("woff2");
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 620px;
      height: 1344px;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #stage {
      width: 390px;
      height: 846px;
      transform: scale(1.5897435897);
      transform-origin: 0 0;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .scan-bg {
      position: absolute;
      inset: -8%;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(40, 44, 48, 0.55), transparent 55%),
        #050505;
    }
    .scan-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 42% 48%;
      filter: brightness(0.22) saturate(0.45) blur(10px);
      transform: scale(1.12);
    }

    .reticle {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 196px;
      height: 196px;
      margin: -98px 0 0 -98px;
      pointer-events: none;
    }
    .reticle i {
      position: absolute;
      width: 28px;
      height: 28px;
      border: 3px solid #CCFF00;
      filter: drop-shadow(0 0 6px rgba(204, 255, 0, 0.45));
    }
    .reticle i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 4px 0 0 0; }
    .reticle i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-radius: 0 4px 0 0; }
    .reticle i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 4px; }
    .reticle i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 4px 0; }

    .scan-label {
      position: absolute;
      left: 0; right: 0;
      top: calc(46% - 148px);
      text-align: center;
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.38em;
      color: #CCFF00;
      text-shadow: 0 0 12px rgba(204, 255, 0, 0.35);
    }
    .scan-hint {
      position: absolute;
      left: 24px; right: 24px;
      top: calc(46% + 128px);
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.62);
    }

    .qr-world {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 168px;
      height: 178px;
      margin: -89px 0 0 -84px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .qr-world img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 196px;
      height: 196px;
      margin: -98px 0 0 -98px;
      border-radius: 34px;
      overflow: hidden;
      pointer-events: none;
    }
    .card-qr {
      position: absolute;
      inset: 0;
    }
    .card-qr img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .morph-block {
      position: absolute;
      border-radius: 14px;
      background: #fff;
    }
    .card-white {
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 34px;
    }
    .card-photo {
      position: absolute;
      inset: 7px;
      border-radius: 27px;
      overflow: hidden;
      background: #0a0a0a;
    }
    .card-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .log {
      position: absolute;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
    }

    .hero {
      position: relative;
      height: 214px;
      flex: 0 0 214px;
      border-radius: 0 0 24px 24px;
      overflow: hidden;
      background: #000;
    }
    .hero img.hero-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
    }
    .hero-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.15) 20%, rgba(0,0,0,0.82) 100%);
    }
    .hero-heart, .hero-info {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 20px;
      background: rgba(14, 14, 14, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
    }
    .hero-heart { top: 54px; left: 16px; }
    .hero-info { top: 162px; right: 16px; }
    .hero-meta {
      position: absolute;
      left: 16px;
      right: 64px;
      bottom: 14px;
    }
    .hero-name {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .chips {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .chip {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.86);
    }

    .logger {
      flex: 1;
      padding: 16px 16px 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .log-head {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .wheels {
      display: grid;
      grid-template-columns: 1fr 1px 1fr;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .wheel { text-align: center; }
    .wheel-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
    }
    .chev {
      width: 44px;
      height: 32px;
      margin: 6px auto;
      border-radius: 16px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      display: grid;
      place-items: center;
      color: rgba(255, 255, 255, 0.7);
    }
    .wheel-val {
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 700;
      font-size: 44px;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    .wheel-unit {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 2px;
    }
    .wheels-split { width: 1px; height: 88px; background: #222; justify-self: center; }
    .rpe {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.45);
      font-size: 13px;
      font-weight: 600;
      margin: 4px 0 12px;
    }
    .rpe span { color: #fff; }
    .cta {
      height: 52px;
      border-radius: 26px;
      background: #CCFF00;
      color: #111;
      font-family: "Space Grotesk", Inter, sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.08em;
      display: grid;
      place-items: center;
      box-shadow: 0 0 24px rgba(204, 255, 0, 0.18);
    }
    .ghosts { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .ghost {
      height: 36px;
      border-radius: 12px;
      background: #141414;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: rgba(255, 255, 255, 0.38);
      font-size: 13px;
    }
    .ghost b { font-weight: 600; color: rgba(255, 255, 255, 0.55); }

    .dock {
      margin-top: auto;
      background: linear-gradient(180deg, transparent, #0a0a0a 18%);
      padding: 8px 12px 0;
    }
    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 4px 10px;
    }
    .dock-sets {
      color: #CCFF00;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .finish {
      background: #CCFF00;
      color: #111;
      font-weight: 700;
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .tabs {
      height: 72px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: end;
      padding: 0 6px 10px;
      position: relative;
    }
    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #454749;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tab.active { color: #CCFF00; }
    .tab svg { width: 22px; height: 22px; }
    .home-logo {
      position: absolute;
      left: 50%;
      bottom: 28px;
      width: 54px;
      height: 54px;
      margin-left: -27px;
      border-radius: 50%;
      background: #0a0a0a;
      display: grid;
      place-items: center;
    }
    .home-logo img { width: 42px; height: 42px; }

    .chrome { position: absolute; inset: 0; pointer-events: none; z-index: 8; }
    .island {
      position: absolute;
      top: 11px;
      left: 50%;
      width: 118px;
      height: 34px;
      margin-left: -59px;
      background: #000;
      border-radius: 20px;
    }
    .status {
      position: absolute;
      top: 14px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.02em;
    }
    .status-right { display: flex; gap: 6px; align-items: center; }
    .back {
      position: absolute;
      top: 58px;
      left: 16px;
      width: 36px;
      height: 36px;
      border-radius: 18px;
      background: rgba(20, 20, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      place-items: center;
    }

    .home-bar {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 128px;
      height: 5px;
      margin-left: -64px;
      background: #fff;
      border-radius: 4px;
      opacity: 0.9;
      z-index: 9;
    }
  </style>
</head>

  <script>
    const LOG_AT = 3.2
    const DURATION = 6.4
    const W = 390
    const H = 846
    const QR_ANCHOR = { x: 0.5, y: 0.46 }
    const SETTLE_SIZE = 196
    const HERO = { left: 0, top: 0, width: W, height: 214, radius: 24 }
    const MORPH_BLOCKS = [
      { x: 0.06, y: 0.1, s: 0.32, t: 0.0 },
      { x: 0.56, y: 0.04, s: 0.3, t: 0.07 },
      { x: 0.62, y: 0.4, s: 0.32, t: 0.03 },
      { x: 0.28, y: 0.26, s: 0.36, t: 0.11 },
      { x: 0.02, y: 0.46, s: 0.32, t: 0.15 },
      { x: 0.24, y: 0.02, s: 0.28, t: 0.17 },
      { x: 0.36, y: 0.58, s: 0.34, t: 0.19 },
      { x: 0.04, y: 0.7, s: 0.3, t: 0.23 },
      { x: 0.6, y: 0.68, s: 0.32, t: 0.13 },
      { x: 0.18, y: 0.36, s: 0.52, t: 0.27 },
    ]

    const $ = (id) => document.getElementById(id)
    const scanBg = $("scanBg")
    const qrWorld = $("qrWorld")
    const reticle = $("reticle")
    const scanLabel = $("scanLabel")
    const scanHint = $("scanHint")
    const card = $("card")
    const cardQr = $("cardQr")
    const cardWhite = $("cardWhite")
    const cardPhoto = $("cardPhoto")
    const log = $("log")
    const backBtn = $("backBtn")
    const blocks = [...document.querySelectorAll(".morph-block")]

    blocks.forEach((el, i) => {
      const b = MORPH_BLOCKS[i]
      el.style.left = b.x * 100 + "%"
      el.style.top = b.y * 100 + "%"
      el.style.width = b.s * 100 + "%"
      el.style.height = b.s * 100 + "%"
    })

    function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x }
    function lerp(a, b, t) { return a + (b - a) * t }
    function remap(t, a, b) { return clamp01((t - a) / (b - a)) }
    function smoothstep(t) { t = clamp01(t); return t * t * (3 - 2 * t) }
    function easeOutCubic(t) { t = clamp01(t); return 1 - (1 - t) ** 3 }
    function easeOutBack(p) {
      const c1 = 1.70158
      const c3 = c1 + 1
      const q = clamp01(p) - 1
      return 1 + c3 * q * q * q + c1 * q * q
    }
    function flightEase(t) {
      // cubic-bezier(0.22, 1, 0.36, 1) sampled via cubic solve is overkill;
      // this is the same strong-start long-glide the app uses.
      return 1 - (1 - clamp01(t)) ** 3.6
    }

    function setCardBox(left, top, width, height, radius) {
      card.style.left = left + "px"
      card.style.top = top + "px"
      card.style.width = width + "px"
      card.style.height = height + "px"
      card.style.margin = "0"
      card.style.borderRadius = radius + "px"
      cardWhite.style.borderRadius = radius + "px"
    }

    function setTime(t) {
      t = Math.max(0, Math.min(DURATION, t))
      const logT = t - LOG_AT
      const morph = remap(logT, 0.0, 0.78)
      const flight = remap(logT, 0.82, 1.34)
      const chrome = remap(logT, 1.18, 1.85)

      // --- SCAN: sticker drifts into the lime reticle, then isolates ---
      const hunt = remap(t, 0.0, 2.35)
      const lock = remap(t, 2.35, 2.7)
      const flatten = remap(t, 2.7, LOG_AT)
      const isolated = t >= LOG_AT - 0.001

      const ox = lerp(-36, 0, easeOutCubic(hunt))
      const oy = lerp(28, 0, easeOutCubic(hunt))
      const rot = lerp(-11, 0, easeOutCubic(Math.max(hunt, flatten)))
      const worldScale = lerp(0.86, 1, easeOutCubic(hunt))
      qrWorld.style.transform = `translate(${ox}px, ${oy}px) rotate(${rot}deg) scale(${worldScale})`
      qrWorld.style.filter = `brightness(${lerp(0.72, 1, hunt)})`

      const retScale = lerp(1.08, 1, smoothstep(lock))
      const retPad = lerp(0, 10, smoothstep(lock))
      reticle.style.transform = `scale(${retScale})`
      reticle.style.width = 196 + retPad * 2 + "px"
      reticle.style.height = 196 + retPad * 2 + "px"
      reticle.style.margin = `${-(98 + retPad)}px 0 0 ${-(98 + retPad)}px`
      reticle.style.opacity = isolated ? 0 : lerp(0.7, 1, hunt)

      scanBg.style.opacity = isolated ? 0 : lerp(1, 0.08, flatten)
      scanBg.style.filter = `blur(${lerp(0, 18, flatten)}px)`
      scanLabel.style.opacity = isolated ? 0 : lerp(0.85, 1, remap(t, 0.0, 0.35)) * (1 - flatten)
      scanHint.style.opacity = isolated ? 0 : lerp(0, 1, remap(t, 0.4, 0.8)) * (1 - lock)
      // Keep the physical sticker up through the 3.2s LOG cut so gym-scan
      // can QR-to-QR blend onto this frame. Morph blocks cover it after.
      qrWorld.style.opacity = morph > 0.42 ? 0 : 1
      const worldW = lerp(168, SETTLE_SIZE, flatten)
      const worldH = lerp(178, SETTLE_SIZE, flatten)
      qrWorld.style.width = worldW + "px"
      qrWorld.style.height = worldH + "px"
      qrWorld.style.margin = `${-worldH / 2}px 0 0 ${-worldW / 2}px`
      qrWorld.style.borderRadius = lerp(18, 22, flatten) + "px"
      backBtn.style.opacity = t < 4.15 ? 1 : 0

      // --- LOG morph, matching the app's QrMorphCard + flight ---
      log.style.opacity = logT > 0.8 ? 1 : 0
      log.style.filter = `blur(${lerp(18, 0, remap(logT, 1.0, 1.55))}px)`
      log.style.transform = `translateY(${lerp(18, 0, easeOutCubic(chrome))}px)`

      const settleLeft = QR_ANCHOR.x * W - SETTLE_SIZE / 2
      const settleTop = QR_ANCHOR.y * H - SETTLE_SIZE / 2
      const grow = 1 + 0.1 * morph
      const morphSize = SETTLE_SIZE * grow
      const morphLeft = QR_ANCHOR.x * W - morphSize / 2
      const morphTop = QR_ANCHOR.y * H - morphSize / 2

      const f = flightEase(flight)
      const left = lerp(morphLeft, HERO.left, f)
      const top = lerp(morphTop, HERO.top, f)
      const width = lerp(morphSize, HERO.width, f)
      const height = lerp(morphSize, HERO.height, f)
      const radius = lerp(34, HERO.radius, f)

      if (t < LOG_AT) {
        setCardBox(settleLeft, settleTop, SETTLE_SIZE, SETTLE_SIZE, 22)
        card.style.opacity = 0
      } else {
        setCardBox(left, top, width, height, radius)
        card.style.opacity = flight > 0.98 ? 0 : 1
      }
      cardQr.style.opacity = 1 - remap(morph, 0.32, 0.5)
      const inset = lerp(7, 0, f)
      cardPhoto.style.inset = inset + "px"
      cardPhoto.style.borderRadius = lerp(27, HERO.radius, f) + "px"

      blocks.forEach((el, i) => {
        const b = MORPH_BLOCKS[i]
        const p = remap(morph, b.t, b.t + 0.24)
        el.style.opacity = p > 0 ? 1 : 0
        el.style.transform = `scale(${easeOutBack(p)})`
      })

      cardWhite.style.opacity = remap(morph, 0.38, 0.52)
      const payoffPop = remap(morph, 0.5, 0.88)
      const payoffFade = remap(morph, 0.5, 0.6)
      cardPhoto.style.opacity = payoffFade
      cardPhoto.querySelector("img").style.transform = `scale(${easeOutBack(payoffPop)})`

      // Logger chrome stagger.
      document.querySelector(".logger").style.opacity = chrome
      document.querySelector(".hero-meta").style.opacity = lerp(0, 1, remap(logT, 1.12, 1.45))
      document.querySelector(".hero-heart").style.opacity = lerp(0, 1, remap(logT, 1.2, 1.5))
      document.querySelector(".hero-info").style.opacity = lerp(0, 1, remap(logT, 1.22, 1.52))
    }

    window.setTime = setTime
    window.SCAN_FLOW = { duration: DURATION, logAt: LOG_AT }

    const ready = Promise.all([
      document.fonts.ready,
      ...[...document.images].map((img) => img.decode ? img.decode().catch(() => {}) : Promise.resolve()),
    ]).then(() => {
      setTime(0)
      window.__ready = true
    })
    window.__readyPromise = ready

    const params = new URLSearchParams(location.search)
    if (params.has("play")) {
      const start = performance.now()
      const loop = () => {
        const t = ((performance.now() - start) / 1000) % DURATION
        setTime(t)
        requestAnimationFrame(loop)
      }
      ready.then(loop)
    } else if (params.has("t")) {
      ready.then(() => setTime(Number(params.get("t")) || 0))
    } else {
      ready.then(() => setTime(0))
    }
  </script>
</body>
</html>
