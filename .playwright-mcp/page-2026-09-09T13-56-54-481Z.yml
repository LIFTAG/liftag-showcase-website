          - generic [ref=f22e364]:
            - generic [ref=f22e365]:
              - heading "What a 1RM is, and what a PR is" [level=2] [ref=f22e366]
              - paragraph [ref=f22e367]: "A one-rep max is the most you can lift once, with the standard you actually compete or train with. A PR is any personal record: a 5-rep bench, a paused squat, a volume day. People search “PR calculator” when they mean this tool. It estimates a 1RM. LIFTAG stores both."
              - paragraph [ref=f22e368]: You do not need a meet to use the number. You need a hard set of a few reps, a named formula, and a log that does not invent a second max next week.
            - generic [ref=f22e369]:
              - heading "How to use this calculator" [level=2] [ref=f22e370]
              - heading "Weight, reps, units" [level=3] [ref=f22e371]
              - paragraph [ref=f22e372]: Type the load and the clean reps. Switch kg or lb; the physical weight stays put. The result updates as you type. No submit button, no email gate, no app wall in front of the number.
              - heading "Pick an exercise to compare your strength" [level=3] [ref=f22e373]
              - paragraph [ref=f22e374]: Choose from 107 common gym exercises with strength benchmarks, across barbell, dumbbell, cable, and machine lifts. Choose a lift, enter your bodyweight, and select a comparison group to see an approximate percentile. Exercise selection changes the comparison, not the 1RM equation.
              - heading "Why 3–8 near failure beats a 15-rep burnout" [level=3] [ref=f22e375]
              - paragraph [ref=f22e376]: Prediction error grows as the set gets longer. A hard 5 is the sweet spot. A 20-rep set measures how long you can last, not what you could unrack once. If you only have a high-rep set, do a heavier one. Then come back.
            - generic [ref=f22e377]:
              - heading "How LIFTAG estimates 1RM" [level=2] [ref=f22e378]
              - paragraph [ref=f22e379]:
                - text: LIFTAG estimates 1RM with the Epley formula,
                - code [ref=f22e380]: 1RM = weight × (1 + reps / 30)
                - text: ", for sets of 1–10 reps near failure. A single is stored as the weight you lifted, not as 3% extra. This page uses the same estimator the LIFTAG app stores per exercise. Optional"
                - link "RPE" [ref=f22e381] [cursor=pointer]:
                  - /url: /journal/what-is-rpe-lifting
                - text: is context on the set. It is not a second 1RM formula.
              - paragraph [ref=f22e382]:
                - text: The formula, assumptions, and worked example are also available in a
                - link "plain Markdown version" [ref=f22e383] [cursor=pointer]:
                  - /url: /tools/1rm-calculator.md
                - text: for readers and search assistants. Core tracking is free;
                - link "pricing" [ref=f22e384] [cursor=pointer]:
                  - /url: /pricing
                - text: is the dated fact sheet.
            - generic [ref=f22e385]:
              - heading "How the strength percentile works" [level=2] [ref=f22e386]
              - paragraph [ref=f22e387]: Your estimated 1RM divided by your bodyweight gives your strength-to-bodyweight ratio. We compare it with the published male or female ratios from Strength Level for the selected exercise. All 107 supported exercises have male and female benchmarks.
              - paragraph [ref=f22e388]: The benchmark anchors are the 5th (beginner), 20th (novice), 50th (intermediate), 80th (advanced), and 95th (elite) percentiles. LIFTAG linearly interpolates between those anchors. Outside them, we show “below 5th” or “above 95th” instead of extrapolating.
              - paragraph [ref=f22e389]: This is an approximate benchmark comparison, not a measured population percentile or Strength Level’s exact-bodyweight calculator. The source reflects people who log lifts, not all people. Broad ratios do not account for age, body proportions, or all differences across bodyweights. Comparisons are available for sets of 1–10 reps and bodyweights of 30–300 kg. A result ranks the selected exercise only, not your overall fitness.
              - paragraph [ref=f22e390]: Dumbbell loads and results are per dumbbell, including the handle; goblet squats and dumbbell pullovers use one weight. Machine designs and pulley ratios vary, making machine comparisons especially approximate. Pull-ups, chin-ups, and dips use bodyweight plus added weight for a total-load 1RM estimate; they do not receive a percentile because compatible bodyweight-ratio benchmarks are unavailable here. All training loads for these exercises include bodyweight too. “Other exercise” also gives an estimate only.
              - group [ref=f22e391]:
                - generic "All 107 exercise benchmarks & sources" [ref=f22e392] [cursor=pointer]
            - generic [ref=f22e393]:
              - heading "How the formulas work" [level=2] [ref=f22e394]
              - paragraph [ref=f22e395]: Default is Epley so the website and the log agree. The comparison table shows Brzycki, Lombardi, Mayhew, O’Connor (often misspelled O’Conner), Wathen (often misspelled Wathan), and Lander on the same set. At 1 rep every formula returns the load you typed.
