                    - cell [ref=f22e412]:
                      - code [ref=f22e413]: 1RM = w × (1 + r / 30)
                    - cell "116.7 kg" [ref=f22e414]
                  - row [ref=f22e415]:
                    - rowheader "Brzycki" [ref=f22e416]
                    - cell "1993" [ref=f22e417]
                    - cell [ref=f22e418]:
                      - code [ref=f22e419]: 1RM = w × 36 / (37 − r)
                    - cell "112.5 kg" [ref=f22e420]
                  - row [ref=f22e421]:
                    - rowheader "Lombardi" [ref=f22e422]
                    - cell "1989" [ref=f22e423]
                    - cell [ref=f22e424]:
                      - code [ref=f22e425]: 1RM = w × r^0.10
                    - cell "117.5 kg" [ref=f22e426]
                  - row [ref=f22e427]:
                    - rowheader "Mayhew" [ref=f22e428]
                    - cell "1992" [ref=f22e429]
                    - cell [ref=f22e430]:
                      - code [ref=f22e431]: 1RM = 100w / (52.2 + 41.9 e^(−0.055r))
                    - cell "119 kg" [ref=f22e432]
                  - row [ref=f22e433]:
                    - rowheader "O'Connor" [ref=f22e434]
                    - cell "1989" [ref=f22e435]
                    - cell [ref=f22e436]:
                      - code [ref=f22e437]: 1RM = w × (1 + r / 40)
                    - cell "112.5 kg" [ref=f22e438]
                  - row [ref=f22e439]:
                    - rowheader "Wathen" [ref=f22e440]
                    - cell "1994" [ref=f22e441]
                    - cell [ref=f22e442]:
                      - code [ref=f22e443]: 1RM = 100w / (48.8 + 53.8 e^(−0.075r))
                    - cell "116.6 kg" [ref=f22e444]
                  - row [ref=f22e445]:
                    - rowheader "Lander" [ref=f22e446]
                    - cell "1985" [ref=f22e447]
                    - cell [ref=f22e448]:
                      - code [ref=f22e449]: 1RM = 100w / (101.3 − 2.67123r)
                    - cell "113.7 kg" [ref=f22e450]
              - heading "Epley (1985)" [level=3] [ref=f22e451]
              - paragraph [ref=f22e452]:
                - text: Linear.
                - code [ref=f22e453]: 1RM = w × (1 + r / 30)
                - text: . At 10 reps it meets Brzycki at w × 4/3. Below 10 it runs a little high. This is LIFTAG’s default because it is stable, named, and already in the app.
              - heading "Brzycki (1993)" [level=3] [ref=f22e454]
              - paragraph [ref=f22e455]:
                - code [ref=f22e456]: 1RM = w × 36 / (37 − r)
                - text: . Conservative in the middle. Undefined at 37 reps, which is why this page will not show a Brzycki number on a 30-rep set as if it were a max.
              - heading "The rest of the family" [level=3] [ref=f22e457]
              - paragraph [ref=f22e458]:
                - text: Lombardi is a power curve. Mayhew and Wathen are exponential and were the LeSuer bench winners. O’Connor is a shallower linear (r/40). Lander is the NSCA-era percentage chart in equation form.
                - link "LeSuer et al. 1997" [ref=f22e459] [cursor=pointer]:
                  - /url: https://journals.lww.com/nsca-jscr/abstract/1997/11000/the_accuracy_of_prediction_equations_for.1.aspx
                - text: "is still the paper to cite: every formula under-predicted deadlift by about 10%."
            - generic [ref=f22e460]:
              - heading "When the estimate is wrong" [level=2] [ref=f22e461]
              - list [ref=f22e462]:
                - listitem [ref=f22e463]: High-rep sets. Past 10, uncertainty increases. Use a lower-rep set before making training decisions.
                - listitem [ref=f22e464]: Isolation lifts and machines. You get more reps at a given percent than on a free squat.
                - listitem [ref=f22e465]: A bounce bench next to a paused one. The formula cannot see the standard. The log can, if you keep it honest.
                - listitem [ref=f22e466]: Squat depth, deadlift start, grip. Formula disagreement is not a confidence interval and cannot diagnose the quality of a set.
                - listitem [ref=f22e467]:
                  - text: Fatigue, a cut, bad sleep. Same kilos, different session. That is what
                  - link "RPE" [ref=f22e468] [cursor=pointer]:
                    - /url: /journal/what-is-rpe-lifting
                  - text: is for.
            - generic [ref=f22e469]:
              - heading "Bench, squat, and deadlift maxes" [level=2] [ref=f22e470]
              - paragraph [ref=f22e471]:
                - text: Select your exercise in the calculator for lift-specific context and strength benchmarks. The 1RM formulas remain the same. Most validation studies focus on
                - link "bench" [ref=f22e472] [cursor=pointer]:
                  - /url: /exercises/barbell-bench-press
                - text: ","
                - link "squat" [ref=f22e473] [cursor=pointer]:
                  - /url: /exercises/barbell-back-squat
                - text: ","
                - link "deadlift" [ref=f22e474] [cursor=pointer]:
                  - /url: /exercises/conventional-deadlift
                - text: . A machine chest press 8RM is not a competition bench.
              - paragraph [ref=f22e475]:
                - text: For percentage programs like 5/3/1, use the 90% training max, as a conservative reference.
                - link "Best workout app for powerlifting" [ref=f22e476] [cursor=pointer]:
                  - /url: /journal/best-workout-app-for-powerlifting
                - text: covers how that looks in a log.
            - generic [ref=f22e477]:
              - heading "How to test a true 1RM" [level=2] [ref=f22e478]
              - list [ref=f22e479]:
                - listitem [ref=f22e480]: Warm up to a heavy triple you already own.
                - listitem [ref=f22e481]: Take small jumps. Leave a rep in the tank until the last attempt.
                - listitem [ref=f22e482]: Use a spotter and safeties. Set the safety pins before adding load.
                - listitem [ref=f22e483]: Log the single. LIFTAG will store it as the max, not as an estimate.
              - paragraph [ref=f22e484]:
                - text: Most weeks you should skip this. Log submax work, watch estimated 1RM trend, and add load when the
                - link "overload" [ref=f22e485] [cursor=pointer]:
                  - /url: /journal/progressive-overload
                - text: is honest.
            - generic [ref=f22e486]:
              - heading "How LIFTAG uses 1RM" [level=2] [ref=f22e487]
              - paragraph [ref=f22e488]: Every working set can update estimated 1RM on that exercise. The app uses Epley, per set, same as the default on this page. PRs stay on the lift you performed. Percentage cues read that history. Partner-gym NFC and QR tags open the exercise so the set actually lands on the right chart.
              - paragraph [ref=f22e489]:
                - link "Get the app" [ref=f22e490] [cursor=pointer]:
                  - /url: /get
                - text: . Core tracking is free on iOS and Android. Estimated 1RM is not paywalled.
            - generic [ref=f22e491]:
              - heading "Frequently asked questions" [level=2] [ref=f22e492]
              - generic [ref=f22e493]:
                - generic [ref=f22e494]:
                  - button "How do you calculate a one-rep max?" [expanded] [ref=f22e495] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e496]: "01"
                    - generic [aria-hidden] [ref=f22e498]: +
                  - region "How do you calculate a one-rep max?" [ref=f22e499]:
                    - paragraph [ref=f22e501]: "Take a hard set of 2–10 reps and run Epley: 1RM = weight × (1 + reps / 30). A 100 kg set of 5 estimates 116.7 kg. That is the default in this calculator and in the LIFTAG app. It is an estimate, not a tested single."
                - generic [ref=f22e502]:
                  - button "Which 1RM formula is most accurate?" [ref=f22e503] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e504]: "02"
                    - generic [aria-hidden] [ref=f22e506]: +
                  - paragraph [ref=f22e507]: None of them wins every lift. LeSuer et al. 1997 found Mayhew and Wathen closest on bench, Wathen on squat, and every equation low on deadlift by about 10%. LIFTAG uses Epley so the website matches the log. Use a hard set of 5 or fewer if the number has to be close.
                - generic [ref=f22e508]:
                  - button "How accurate is a 1RM calculator?" [ref=f22e509] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e510]: "03"
                    - generic [aria-hidden] [ref=f22e512]: +
                  - paragraph [ref=f22e513]: On compounds, a hard 2–8 is usually inside about 5%. Past 10 reps the equations measure endurance, not a max. Reynolds, Gordon, and Robergs 2006 found 5RM beat 10RM beat 20RM. Do not take an estimate into a meet.
                - generic [ref=f22e514]:
                  - button "Is 5 reps about 85% of 1RM?" [ref=f22e515] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e516]: "04"
                    - generic [aria-hidden] [ref=f22e518]: +
                  - paragraph [ref=f22e519]: NSCA load charts put a 5RM near 87% of a tested 1RM. Epley from a 5-rep set treats that set as about 86% of the estimated max (100 / 116.7). Close enough to program from. Not close enough to skip a real opener.
                - generic [ref=f22e520]:
                  - button "Can I use this as a bench press or squat max calculator?" [ref=f22e521] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e522]: "05"
                    - generic [aria-hidden] [ref=f22e524]: +
                  - paragraph [ref=f22e525]: "Yes. Same tool, same URL. Pick the lift if you want the deadlift caveat: published equations under-predict deadlift by about 10%. Formulas were mostly validated on bench, squat, and deadlift, not on curls."
                - generic [ref=f22e526]:
                  - button "Should I test a true 1RM or estimate it?" [ref=f22e527] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e528]: "06"
                    - generic [aria-hidden] [ref=f22e530]: +
                  - paragraph [ref=f22e531]: Most lifters should estimate. A true single needs a spotter, safeties, and a reason. If you only need percentages for next week, a hard set of 3–5 plus Epley is enough. ACSM still treats a tested 1RM as the gold standard, not as homework.
                - generic [ref=f22e532]:
                  - button "Does LIFTAG calculate 1RM automatically?" [ref=f22e533] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e534]: "07"
                    - generic [aria-hidden] [ref=f22e536]: +
                  - paragraph [ref=f22e537]: Yes. Log the set. Estimated 1RM updates per exercise with Epley, the same math as this page. PRs stay on the lift you actually performed. Optional RPE is context, not a second formula.
                - generic [ref=f22e538]:
                  - button "How is my strength percentile calculated?" [ref=f22e539] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e540]: "08"
                    - generic [aria-hidden] [ref=f22e542]: +
                  - paragraph [ref=f22e543]: LIFTAG divides your estimated 1RM by bodyweight and interpolates between published Strength Level ratios for your exercise and comparison group. It is an approximate lifter benchmark, not a percentile of the general population. It does not adjust for age. Below the 5th or above the 95th benchmark, the calculator shows a bound instead of extrapolating.
                - generic [ref=f22e544]:
                  - button "Which exercises have strength comparisons?" [ref=f22e545] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e546]: "09"
                    - generic [aria-hidden] [ref=f22e548]: +
                  - paragraph [ref=f22e549]: Common barbell, dumbbell, cable, and machine gym exercises have male and female bodyweight-ratio benchmarks, including bench, squat, deadlift, Olympic lifts, rows, curls, pulldowns, and leg press. Enter your bodyweight and select a group to compare a set of 1–10 reps. Dumbbell weights are per dumbbell. Pull-ups, chin-ups, and dips give a total-load estimate (bodyweight plus added weight) only; other exercises also receive no percentile.
                - generic [ref=f22e550]:
                  - button "What is the difference between a 1RM and a PR?" [ref=f22e551] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f22e552]: "10"
                    - generic [aria-hidden] [ref=f22e554]: +
                  - paragraph [ref=f22e555]: "1RM is a one-repetition maximum, a single. A PR is any personal record: a 5RM, a paused bench, a volume PR. This page estimates a 1RM. LIFTAG stores both."
