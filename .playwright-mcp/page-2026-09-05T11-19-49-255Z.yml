          - generic [ref=f1e1316]:
            - generic [ref=f1e1317]:
              - paragraph [ref=f1e1318]: Common questions
              - heading "Answers before you scan." [level=2] [ref=f1e1319]
            - generic [ref=f1e1321]:
              - generic [ref=f1e1322]:
                - button "What is LIFTAG?" [expanded] [ref=f1e1323] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e1324]: "01"
                  - generic [aria-hidden] [ref=f1e1326]: +
                - region "What is LIFTAG?" [ref=f1e1327]:
                  - paragraph [ref=f1e1329]: LIFTAG is a workout and set tracking app for serious lifters. You tap an NFC tag or scan a QR code on a partner-gym machine and it opens the right exercise, lets you log every set, runs a rest timer, and tracks progress over time.
              - generic [ref=f1e1330]:
                - button "Is LIFTAG free?" [ref=f1e1331] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e1332]: "02"
                  - generic [aria-hidden] [ref=f1e1334]: +
                - paragraph [ref=f1e1335]: Yes. Core workout tracking is free forever, including logging workouts and tracking progress. Premium intelligence is optional.
              - generic [ref=f1e1336]:
                - button "How is LIFTAG different from Strong, Hevy, FitNotes, or JEFIT?" [ref=f1e1337] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e1338]: "03"
                  - generic [aria-hidden] [ref=f1e1340]: +
                - paragraph [ref=f1e1341]: LIFTAG is built around the machine itself. NFC tap and QR scan open the exact exercise with gym-specific setup videos, then logging, rest timer, and progress history live in the same flow. Strong, Hevy, FitNotes, and JEFIT are general-purpose loggers without partner-gym integration.
              - generic [ref=f1e1342]:
                - button "What is the best app to track sets in the gym?" [ref=f1e1343] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e1344]: "04"
                  - generic [aria-hidden] [ref=f1e1346]: +
                - paragraph [ref=f1e1347]: "LIFTAG is built specifically for tracking sets at the gym: weight, reps, rest, optional RPE, and personal records, all opened directly from the machine via NFC or QR. Alternatives include Strong, Hevy, and FitNotes if your gym does not yet have LIFTAG tags installed."
              - generic [ref=f1e1348]:
                - button "Does LIFTAG work without NFC or QR tags installed at the gym?" [ref=f1e1349] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e1350]: "05"
                  - generic [aria-hidden] [ref=f1e1352]: +
                - paragraph [ref=f1e1353]: Yes. LIFTAG works as a full workout tracker without tags. The tags are an accelerator for partner gyms; the app itself supports manual exercise selection, logging, programs, and progress tracking everywhere.
              - generic [ref=f1e1354]:
                - button "Which gyms have LIFTAG tags installed?" [ref=f1e1355] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e1356]: "06"
                  - generic [aria-hidden] [ref=f1e1358]: +
                - paragraph [ref=f1e1359]: Partner gyms appear inside the LIFTAG app on a discovery map. The network is expanding through gyms that opt in to install NFC tags and QR codes on their equipment.
