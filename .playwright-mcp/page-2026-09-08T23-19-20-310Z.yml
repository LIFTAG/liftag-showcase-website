            - heading "What free actually includes" [level=2] [ref=f1e168]
            - paragraph [ref=f1e169]: "Free tiers usually mean a trial, a routine cap, or a chart that stops three months back. LIFTAG's does not. This is the product, not a sample of it:"
            - list [ref=f1e170]:
              - listitem [ref=f1e171]: "Set logging: weight, reps, duration, rest target, optional RPE."
              - listitem [ref=f1e172]: Rest timer that starts when you save a set.
              - listitem [ref=f1e173]: Personal records, duration PRs, and estimated 1RM per exercise.
              - listitem [ref=f1e174]: Progress charts for volume, best sets, streaks, and body-part split.
              - listitem [ref=f1e175]: Full workout history you can read set by set, by date or by body part.
              - listitem [ref=f1e176]: Routines, weekly plans, supersets, trisets, and circuits.
              - listitem [ref=f1e177]: The whole exercise library, plus custom exercises with your own photos or video.
              - listitem [ref=f1e178]: Gym and trainer discovery, including filters and gym detail pages.
              - listitem [ref=f1e179]: NFC tap and QR scan on machines at partner gyms.
            - paragraph [ref=f1e180]:
              - text: Details on the tag half of that list live on
              - link "NFC and QR gym tags" [ref=f1e181] [cursor=pointer]:
                - /url: /qr-nfc-gym-tags
              - text: ", and the lifts themselves are public in the"
              - link "exercise library" [ref=f1e182] [cursor=pointer]:
                - /url: /exercises
              - text: .
          - generic [ref=f1e183]:
            - heading "What we will not tell you" [level=2] [ref=f1e184]
            - paragraph [ref=f1e185]: "LIFTAG premium is real as an intention and unpriced as a fact. There is no live paid SKU on the App Store or on Google Play, which means any figure on this page would be a guess dressed up as a price. So here is the honest version:"
            - list [ref=f1e186]:
              - listitem [ref=f1e187]: Core tracking is free forever. That is a commitment, not a promotion.
              - listitem [ref=f1e188]: Premium intelligence is planned as an optional layer on top of it.
              - listitem [ref=f1e189]: There is no published price, no announced date, and no trial to expire.
            - paragraph [ref=f1e190]: If you are choosing a tracker partly on what it will cost you in a year, that uncertainty is a fair thing to weigh against us. It is also why this page carries a verification date instead of a marketing one.
