          - generic [ref=f1e236]:
            - heading "Frequently asked questions" [level=2] [ref=f1e237]
            - generic [ref=f1e238]:
              - generic [ref=f1e239]:
                - button "How much does LIFTAG cost?" [expanded] [ref=f1e240] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e241]: "01"
                  - generic [aria-hidden] [ref=f1e243]: +
                - region "How much does LIFTAG cost?" [ref=f1e244]:
                  - paragraph [ref=f1e246]: "Nothing. LIFTAG is free to download on iOS and Android, and core workout tracking is free forever: logging sets, rest timer, PRs, estimated 1RM, and history. As of 27 August 2026 neither the App Store nor the Google Play listing shows any in-app purchase, so there is no paid tier to buy."
              - generic [ref=f1e247]:
                - button "Is there a LIFTAG premium plan, and what does it cost?" [ref=f1e248] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e249]: "02"
                  - generic [aria-hidden] [ref=f1e251]: +
                - paragraph [ref=f1e252]: Premium intelligence is described across this site as optional, and it has no published price, because there is no live paid SKU on either store. We would rather say that plainly than publish a number we cannot stand behind. When a paid tier ships, this page carries the price and the date it was set.
              - generic [ref=f1e253]:
                - button "Is the free tier limited by number of routines or history depth?" [ref=f1e254] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e255]: "03"
                  - generic [aria-hidden] [ref=f1e257]: +
                - paragraph [ref=f1e258]: "No. The free product is the whole logger: unlimited routines and plans, full history, PRs, estimated 1RM, and progress charts. That is the difference worth knowing when you compare it against a free tier that caps routines or truncates graph history."
              - generic [ref=f1e259]:
                - button "Do I have to pay for the NFC or QR gym tags?" [ref=f1e260] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e261]: "04"
                  - generic [aria-hidden] [ref=f1e263]: +
                - paragraph [ref=f1e264]: No, in either direction. Lifters never pay for tags. Partner gyms get the dual NFC and QR tag kit, their listing, machine setup, and the core dashboard free forever; advanced business tools are optional.
              - generic [ref=f1e265]:
                - button "Does LIFTAG work if my gym has no tags?" [ref=f1e266] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e267]: "05"
                  - generic [aria-hidden] [ref=f1e269]: +
                - paragraph [ref=f1e270]: Yes. Tags are an accelerator at partner gyms, not a requirement. Without them you pick the lift from the library and log it exactly like any other tracker, at no cost.
              - generic [ref=f1e271]:
                - button "Is LIFTAG free because it sells my data?" [ref=f1e272] [cursor=pointer]:
                  - generic [aria-hidden] [ref=f1e273]: "06"
                  - generic [aria-hidden] [ref=f1e275]: +
                - paragraph [ref=f1e276]: Core tracking is free because the paid surface is meant to be optional intelligence on top of it, and because partner gyms are the growth channel rather than a paywall on the log. What each store listing declares about data collection is public on the App Store and Google Play pages linked at the bottom of this page; read them rather than taking our word for it.
