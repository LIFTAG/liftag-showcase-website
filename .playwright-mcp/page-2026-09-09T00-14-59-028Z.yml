            - generic [ref=f58e388]:
              - heading "What free actually includes" [level=2] [ref=f58e389]
              - paragraph [ref=f58e390]: "Free tiers usually mean a trial, a routine cap, or a chart that stops three months back. LIFTAG's does not. This is the product, not a sample of it:"
              - list [ref=f58e391]:
                - listitem [ref=f58e392]: "Set logging: weight, reps, duration, rest target, optional RPE."
                - listitem [ref=f58e393]: Rest timer that starts when you save a set.
                - listitem [ref=f58e394]: Personal records, duration PRs, and estimated 1RM per exercise.
                - listitem [ref=f58e395]: Progress charts for volume, best sets, streaks, and body-part split.
                - listitem [ref=f58e396]: Full workout history you can read set by set, by date or by body part.
                - listitem [ref=f58e397]: Routines, weekly plans, supersets, trisets, and circuits.
                - listitem [ref=f58e398]: The whole exercise library, plus custom exercises with your own photos or video.
                - listitem [ref=f58e399]: Gym and trainer discovery, including filters and gym detail pages.
                - listitem [ref=f58e400]: NFC tap and QR scan on machines at partner gyms.
              - paragraph [ref=f58e401]:
                - text: Details on the tag half of that list live on
                - link "NFC and QR gym tags" [ref=f58e402] [cursor=pointer]:
                  - /url: /qr-nfc-gym-tags
                - text: ", and the lifts themselves are public in the"
                - link "exercise library" [ref=f58e403] [cursor=pointer]:
                  - /url: /exercises
                - text: .
            - generic [ref=f58e404]:
              - heading "What we will not tell you" [level=2] [ref=f58e405]
              - paragraph [ref=f58e406]: "LIFTAG premium is real as an intention and unpriced as a fact. There is no live paid SKU on the App Store or on Google Play, which means any figure on this page would be a guess dressed up as a price. So here is the honest version:"
              - list [ref=f58e407]:
                - listitem [ref=f58e408]: Core tracking is free forever. That is a commitment, not a promotion.
                - listitem [ref=f58e409]: Premium intelligence is planned as an optional layer on top of it.
                - listitem [ref=f58e410]: There is no published price, no announced date, and no trial to expire.
              - paragraph [ref=f58e411]: If you are choosing a tracker partly on what it will cost you in a year, that uncertainty is a fair thing to weigh against us. It is also why this page carries a verification date instead of a marketing one.
            - generic [ref=f58e412]:
              - heading "Against the two apps people compare us to" [level=2] [ref=f58e413]
