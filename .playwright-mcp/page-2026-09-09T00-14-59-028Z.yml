                - text: ","
                - link "Google Play" [ref=f58e504] [cursor=pointer]:
                  - /url: https://play.google.com/store/apps/details?id=com.liftag.app
                - text: .
              - paragraph [ref=f58e505]: We ship one of the apps in that table, so read the pricing rows and the source links rather than the tone. Store prices change without warning; verify before you buy anything. Updated August 2026.
