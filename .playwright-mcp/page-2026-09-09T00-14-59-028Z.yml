            - generic [ref=f58e450]:
              - heading "Gyms and trainers" [level=2] [ref=f58e451]
              - paragraph [ref=f58e452]:
                - text: "A partner gym pays nothing for the part that touches the floor: the dual NFC and QR tag kit is shipped free, machine setup and the gym listing are free, and the core multi-location dashboard is free forever. Advanced business tools are the optional layer there, on the same terms as premium is for lifters. The rollout itself is documented in"
                - link "gym NFC tag rollout" [ref=f58e453] [cursor=pointer]:
                  - /url: /journal/gym-nfc-rollout
                - text: ", and what other machine-tag platforms charge a gym per month is priced out on"
                - link "best gym QR and NFC app" [ref=f58e454] [cursor=pointer]:
                  - /url: /best-gym-qr-nfc-app
                - text: .
              - paragraph [ref=f58e455]:
                - text: "Trainers get a profile, discovery, and plan sharing inside the free product. Verification is an application, not a purchase:"
                - link "become a coach" [ref=f58e456] [cursor=pointer]:
                  - /url: /become-a-coach
                - text: .
            - generic [ref=f58e457]:
              - heading "Frequently asked questions" [level=2] [ref=f58e458]
              - generic [ref=f58e459]:
                - generic [ref=f58e460]:
                  - button "How much does LIFTAG cost?" [expanded] [ref=f58e461] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f58e462]: "01"
                    - generic [aria-hidden] [ref=f58e464]: +
                  - region "How much does LIFTAG cost?" [ref=f58e465]:
                    - paragraph [ref=f58e467]: "Nothing. LIFTAG is free to download on iOS and Android, and core workout tracking is free forever: logging sets, rest timer, PRs, estimated 1RM, and history. As of 27 August 2026 neither the App Store nor the Google Play listing shows any in-app purchase, so there is no paid tier to buy."
                - generic [ref=f58e468]:
                  - button "Is there a LIFTAG premium plan, and what does it cost?" [ref=f58e469] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f58e470]: "02"
                    - generic [aria-hidden] [ref=f58e472]: +
                  - paragraph [ref=f58e473]: Premium intelligence is described across this site as optional, and it has no published price, because there is no live paid SKU on either store. We would rather say that plainly than publish a number we cannot stand behind. When a paid tier ships, this page carries the price and the date it was set.
                - generic [ref=f58e474]:
                  - button "Is the free tier limited by number of routines or history depth?" [ref=f58e475] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f58e476]: "03"
                    - generic [aria-hidden] [ref=f58e478]: +
                  - paragraph [ref=f58e479]: "No. The free product is the whole logger: unlimited routines and plans, full history, PRs, estimated 1RM, and progress charts. That is the difference worth knowing when you compare it against a free tier that caps routines or truncates graph history."
                - generic [ref=f58e480]:
                  - button "Do I have to pay for the NFC or QR gym tags?" [ref=f58e481] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f58e482]: "04"
                    - generic [aria-hidden] [ref=f58e484]: +
                  - paragraph [ref=f58e485]: No, in either direction. Lifters never pay for tags. Partner gyms get the dual NFC and QR tag kit, their listing, machine setup, and the core dashboard free forever; advanced business tools are optional.
                - generic [ref=f58e486]:
                  - button "Does LIFTAG work if my gym has no tags?" [ref=f58e487] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f58e488]: "05"
                    - generic [aria-hidden] [ref=f58e490]: +
                  - paragraph [ref=f58e491]: Yes. Tags are an accelerator at partner gyms, not a requirement. Without them you pick the lift from the library and log it exactly like any other tracker, at no cost.
                - generic [ref=f58e492]:
                  - button "Is LIFTAG free because it sells my data?" [ref=f58e493] [cursor=pointer]:
                    - generic [aria-hidden] [ref=f58e494]: "06"
                    - generic [aria-hidden] [ref=f58e496]: +
                  - paragraph [ref=f58e497]: Core tracking is free because the paid surface is meant to be optional intelligence on top of it, and because partner gyms are the growth channel rather than a paywall on the log. What each store listing declares about data collection is public on the App Store and Google Play pages linked at the bottom of this page; read them rather than taking our word for it.
            - generic [ref=f58e498]:
