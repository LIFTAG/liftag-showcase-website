        - generic [ref=f9e1131]:
          - generic [ref=f9e1132]:
            - paragraph [ref=f9e1133]: Common questions
            - heading "Answers before you scan." [level=2] [ref=f9e1134]
          - generic [ref=f9e1136]:
            - generic [ref=f9e1137]:
              - button "What is LIFTAG?" [expanded] [ref=f9e1138] [cursor=pointer]:
                - generic [aria-hidden] [ref=f9e1139]: "01"
                - generic [aria-hidden] [ref=f9e1141]: +
              - region "What is LIFTAG?" [ref=f9e1142]:
                - paragraph [ref=f9e1144]: LIFTAG is a workout and set tracking app for serious lifters. You tap an NFC tag or scan a QR code on a partner-gym machine and it opens the right exercise, lets you log every set, runs a rest timer, and tracks progress over time.
            - generic [ref=f9e1145]:
              - button "Is LIFTAG free?" [ref=f9e1146] [cursor=pointer]:
                - generic [aria-hidden] [ref=f9e1147]: "02"
                - generic [aria-hidden] [ref=f9e1149]: +
              - paragraph [ref=f9e1150]: Yes. Core workout tracking is free forever, including logging workouts and tracking progress. Premium intelligence is optional.
            - generic [ref=f9e1151]:
              - button "How is LIFTAG different from Strong, Hevy, FitNotes, or JEFIT?" [ref=f9e1152] [cursor=pointer]:
                - generic [aria-hidden] [ref=f9e1153]: "03"
                - generic [aria-hidden] [ref=f9e1155]: +
              - paragraph [ref=f9e1156]: LIFTAG is built around the machine itself. NFC tap and QR scan open the exact exercise with gym-specific setup videos, then logging, rest timer, and progress history live in the same flow. Strong, Hevy, FitNotes, and JEFIT are general-purpose loggers without partner-gym integration.
            - generic [ref=f9e1157]:
              - button "What is the best app to track sets in the gym?" [ref=f9e1158] [cursor=pointer]:
                - generic [aria-hidden] [ref=f9e1159]: "04"
                - generic [aria-hidden] [ref=f9e1161]: +
              - paragraph [ref=f9e1162]: "LIFTAG is built specifically for tracking sets at the gym: weight, reps, rest, optional RPE, and personal records, all opened directly from the machine via NFC or QR. Alternatives include Strong, Hevy, and FitNotes if your gym does not yet have LIFTAG tags installed."
            - generic [ref=f9e1163]:
              - button "Does LIFTAG work without NFC or QR tags installed at the gym?" [ref=f9e1164] [cursor=pointer]:
                - generic [aria-hidden] [ref=f9e1165]: "05"
                - generic [aria-hidden] [ref=f9e1167]: +
              - paragraph [ref=f9e1168]: Yes. LIFTAG works as a full workout tracker without tags. The tags are an accelerator for partner gyms; the app itself supports manual exercise selection, logging, programs, and progress tracking everywhere.
            - generic [ref=f9e1169]:
              - button "Which gyms have LIFTAG tags installed?" [ref=f9e1170] [cursor=pointer]:
                - generic [aria-hidden] [ref=f9e1171]: "06"
                - generic [aria-hidden] [ref=f9e1173]: +
              - paragraph [ref=f9e1174]: Partner gyms appear inside the LIFTAG app on a discovery map. The network is expanding through gyms that opt in to install NFC tags and QR codes on their equipment.
