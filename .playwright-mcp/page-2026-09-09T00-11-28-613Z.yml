        - generic [ref=f53e359]:
          - article [ref=f53e360]:
            - heading "Track clients from real set history" [level=2] [ref=f53e361]
            - paragraph [ref=f53e362]: Instead of chasing screenshots and vague updates, trainers can review workout history, progress signals, PRs, and consistency from the same system clients use to train.
          - article [ref=f53e363]:
            - heading "Share plans where clients log" [level=2] [ref=f53e364]
            - paragraph [ref=f53e365]: Build and share workout plans inside the product flow so clients can move from plan to machine to logged set without switching tools.
          - article [ref=f53e366]:
            - heading "Be discoverable inside the gym network" [level=2] [ref=f53e367]
            - paragraph [ref=f53e368]: LIFTAG gives trainers a profile and discovery surface connected to the gyms, lifters, and training context where coaching decisions happen.
