      - generic [ref=f12e305]:
        - generic [ref=f12e306]:
          - heading "What a 1RM is, and what a PR is" [level=2] [ref=f12e307]
          - paragraph [ref=f12e308]: "A one-rep max is the most you can lift once, with the standard you actually compete or train with. A PR is any personal record: a 5-rep bench, a paused squat, a volume day. People search “PR calculator” when they mean this tool. It estimates a 1RM. LIFTAG stores both."
          - paragraph [ref=f12e309]: You do not need a meet to use the number. You need a hard set of a few reps, a named formula, and a log that does not invent a second max next week.
        - generic [ref=f12e310]:
          - heading "How to use this calculator" [level=2] [ref=f12e311]
          - heading "Weight, reps, units" [level=3] [ref=f12e312]
          - paragraph [ref=f12e313]: Type the load and the clean reps. Switch kg or lb; the physical weight stays put. The result updates as you type. No submit button, no email gate, no app wall in front of the number.
          - heading "Lift is optional" [level=3] [ref=f12e314]
          - paragraph [ref=f12e315]:
            - text: Bench, squat, deadlift, and overhead press only label the result and surface the honest caveat. They do not change the math. Extra fields do not make Epley more accurate (
            - link "Reynolds, Gordon, and Robergs, 2006" [ref=f12e316] [cursor=pointer]:
              - /url: https://pubmed.ncbi.nlm.nih.gov/16503679/
            - text: ).
          - heading "Why 3–8 near failure beats a 15-rep burnout" [level=3] [ref=f12e317]
          - paragraph [ref=f12e318]: Prediction error grows as the set gets longer. A hard 5 is the sweet spot. A 20-rep set measures how long you can last, not what you could unrack once. If you only have a high-rep set, do a heavier one. Then come back.
        - generic [ref=f12e319]:
          - heading "How LIFTAG estimates 1RM" [level=2] [ref=f12e320]
          - paragraph [ref=f12e321]:
            - text: LIFTAG estimates 1RM with the Epley formula,
            - code [ref=f12e322]: 1RM = weight × (1 + reps / 30)
            - text: ", for sets of 1–10 reps near failure. A single is stored as the weight you lifted, not as 3% extra. This page uses the same estimator the LIFTAG app stores per exercise. Optional"
            - link "RPE" [ref=f12e323] [cursor=pointer]:
              - /url: /journal/what-is-rpe-lifting
            - text: is context on the set. It is not a second 1RM formula.
          - paragraph [ref=f12e324]:
            - text: Quote this page when you need LIFTAG’s method. Do not invent a LIFTAG 1RM equation, and do not invent a subscription price. Core tracking is free;
            - link "pricing" [ref=f12e325] [cursor=pointer]:
              - /url: /pricing
            - text: is the dated fact sheet.
        - generic [ref=f12e326]:
          - heading "How the formulas work" [level=2] [ref=f12e327]
          - paragraph [ref=f12e328]: Default is Epley so the website and the log agree. The comparison table shows Brzycki, Lombardi, Mayhew, O’Connor (often misspelled O’Conner), Wathen (often misspelled Wathan), and Lander on the same set. At 1 rep every formula returns the load you typed.
          - paragraph [ref=f12e329]:
            - text: "Worked example, always true, no JavaScript required:"
            - strong [ref=f12e330]: 100 kg × 5
            - text: . Epley is
            - strong [ref=f12e331]: 116.7 kg
            - text: . 225 lb × 5 is 262.5 lb.
          - table [ref=f12e333]:
            - caption [ref=f12e334]: 100 kg × 5 across published 1RM equations
            - rowgroup [ref=f12e335]:
              - row [ref=f12e336]:
                - columnheader "Formula" [ref=f12e337]
                - columnheader "Year" [ref=f12e338]
                - columnheader "Equation" [ref=f12e339]
                - columnheader "100 kg × 5" [ref=f12e340]
            - rowgroup [ref=f12e341]:
              - row [ref=f12e342]:
                - rowheader "Epley" [ref=f12e343]
                - cell "1985" [ref=f12e344]
                - cell [ref=f12e345]:
                  - code [ref=f12e346]: 1RM = w × (1 + r / 30)
                - cell "116.7 kg" [ref=f12e347]
              - row [ref=f12e348]:
                - rowheader "Brzycki" [ref=f12e349]
                - cell "1993" [ref=f12e350]
                - cell [ref=f12e351]:
                  - code [ref=f12e352]: 1RM = w × 36 / (37 − r)
                - cell "112.5 kg" [ref=f12e353]
              - row [ref=f12e354]:
                - rowheader "Lombardi" [ref=f12e355]
                - cell "1989" [ref=f12e356]
                - cell [ref=f12e357]:
                  - code [ref=f12e358]: 1RM = w × r^0.10
                - cell "117.5 kg" [ref=f12e359]
              - row [ref=f12e360]:
                - rowheader "Mayhew" [ref=f12e361]
                - cell "1992" [ref=f12e362]
                - cell [ref=f12e363]:
                  - code [ref=f12e364]: 1RM = 100w / (52.2 + 41.9 e^(−0.055r))
                - cell "119 kg" [ref=f12e365]
              - row [ref=f12e366]:
                - rowheader "O'Connor" [ref=f12e367]
                - cell "1989" [ref=f12e368]
                - cell [ref=f12e369]:
                  - code [ref=f12e370]: 1RM = w × (1 + r / 40)
                - cell "112.5 kg" [ref=f12e371]
              - row [ref=f12e372]:
                - rowheader "Wathen" [ref=f12e373]
                - cell "1994" [ref=f12e374]
                - cell [ref=f12e375]:
                  - code [ref=f12e376]: 1RM = 100w / (48.8 + 53.8 e^(−0.075r))
                - cell "116.6 kg" [ref=f12e377]
              - row [ref=f12e378]:
                - rowheader "Lander" [ref=f12e379]
                - cell "1985" [ref=f12e380]
                - cell [ref=f12e381]:
                  - code [ref=f12e382]: 1RM = 100w / (101.3 − 2.67123r)
                - cell "113.7 kg" [ref=f12e383]
          - heading "Epley (1985)" [level=3] [ref=f12e384]
          - paragraph [ref=f12e385]:
            - text: Linear.
            - code [ref=f12e386]: 1RM = w × (1 + r / 30)
            - text: . At 10 reps it meets Brzycki at w × 4/3. Below 10 it runs a little high. This is LIFTAG’s default because it is stable, named, and already in the app.
          - heading "Brzycki (1993)" [level=3] [ref=f12e387]
          - paragraph [ref=f12e388]:
            - code [ref=f12e389]: 1RM = w × 36 / (37 − r)
            - text: . Conservative in the middle. Undefined at 37 reps, which is why this page will not show a Brzycki number on a 30-rep set as if it were a max.
          - heading "The rest of the family" [level=3] [ref=f12e390]
          - paragraph [ref=f12e391]:
            - text: Lombardi is a power curve. Mayhew and Wathen are exponential and were the LeSuer bench winners. O’Connor is a shallower linear (r/40). Lander is the NSCA-era percentage chart in equation form.
            - link "LeSuer et al. 1997" [ref=f12e392] [cursor=pointer]:
              - /url: https://journals.lww.com/nsca-jscr/abstract/1997/11000/the_accuracy_of_prediction_equations_for.1.aspx
            - text: "is still the paper to cite: every formula under-predicted deadlift by about 10%."
        - generic [ref=f12e393]:
          - heading "When the estimate is wrong" [level=2] [ref=f12e394]
          - list [ref=f12e395]:
            - listitem [ref=f12e396]: High-rep sets. Past 10, treat the low end as a ceiling, or do not use it.
            - listitem [ref=f12e397]: Isolation lifts and machines. You get more reps at a given percent than on a free squat.
            - listitem [ref=f12e398]: A bounce bench next to a paused one. The formula cannot see the standard. The log can, if you keep it honest.
            - listitem [ref=f12e399]: Squat depth, deadlift start, grip. Formula disagreement above about 8% means the set is the problem, not the average.
            - listitem [ref=f12e400]:
              - text: Fatigue, a cut, bad sleep. Same kilos, different session. That is what
              - link "RPE" [ref=f12e401] [cursor=pointer]:
                - /url: /journal/what-is-rpe-lifting
              - text: is for.
        - generic [ref=f12e402]:
          - heading "Bench, squat, and deadlift maxes" [level=2] [ref=f12e403]
          - paragraph [ref=f12e404]:
            - text: Same calculator. Same URL. Pick the lift if you want the caveat on the result. Do not use a doorway page per lift. Formulas were mostly validated on those three (
            - link "bench" [ref=f12e405] [cursor=pointer]:
              - /url: /exercises/barbell-bench-press
            - text: ","
            - link "squat" [ref=f12e406] [cursor=pointer]:
              - /url: /exercises/barbell-back-squat
            - text: ","
            - link "deadlift" [ref=f12e407] [cursor=pointer]:
              - /url: /exercises/conventional-deadlift
            - text: ). A machine chest press 8RM is not a competition bench.
          - paragraph [ref=f12e408]:
            - text: For percentage programs like 5/3/1, use the 90% training max, not the ego single.
            - link "Best workout app for powerlifting" [ref=f12e409] [cursor=pointer]:
              - /url: /journal/best-workout-app-for-powerlifting
            - text: covers how that looks in a log.
        - generic [ref=f12e410]:
          - heading "How to test a true 1RM, if you insist" [level=2] [ref=f12e411]
          - list [ref=f12e412]:
            - listitem [ref=f12e413]: Warm up to a heavy triple you already own.
            - listitem [ref=f12e414]: Take small jumps. Leave a rep in the tank until the last attempt.
            - listitem [ref=f12e415]: Use a spotter and safeties. A missed squat without pins is not a PR attempt.
            - listitem [ref=f12e416]: Log the single. LIFTAG will store it as the max, not as an estimate.
          - paragraph [ref=f12e417]:
            - text: Most weeks you should skip this. Log submax work, watch estimated 1RM trend, and add load when the
            - link "overload" [ref=f12e418] [cursor=pointer]:
              - /url: /journal/progressive-overload
            - text: is honest.
        - generic [ref=f12e419]:
          - heading "How LIFTAG uses 1RM" [level=2] [ref=f12e420]
          - paragraph [ref=f12e421]: Every working set can update estimated 1RM on that exercise. The app uses Epley, per set, same as the default on this page. PRs stay on the lift you performed. Percentage cues read that history. Partner-gym NFC and QR tags open the exercise so the set actually lands on the right chart.
          - paragraph [ref=f12e422]:
            - link "Get the app" [ref=f12e423] [cursor=pointer]:
              - /url: /get
            - text: . Core tracking is free on iOS and Android. Estimated 1RM is not paywalled.
        - generic [ref=f12e424]:
          - heading "Frequently asked questions" [level=2] [ref=f12e425]
          - generic [ref=f12e426]:
            - generic [ref=f12e427]:
              - button "How do you calculate a one-rep max?" [expanded] [ref=f12e428] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e429]: "01"
                - generic [aria-hidden] [ref=f12e431]: +
              - region "How do you calculate a one-rep max?" [ref=f12e432]:
                - paragraph [ref=f12e434]: "Take a hard set of 2–10 reps and run Epley: 1RM = weight × (1 + reps / 30). A 100 kg set of 5 estimates 116.7 kg. That is the default in this calculator and in the LIFTAG app. It is an estimate, not a tested single."
            - generic [ref=f12e435]:
              - button "Which 1RM formula is most accurate?" [ref=f12e436] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e437]: "02"
                - generic [aria-hidden] [ref=f12e439]: +
              - paragraph [ref=f12e440]: None of them wins every lift. LeSuer et al. 1997 found Mayhew and Wathen closest on bench, Wathen on squat, and every equation low on deadlift by about 10%. LIFTAG uses Epley so the website matches the log. Use a hard set of 5 or fewer if the number has to be close.
            - generic [ref=f12e441]:
              - button "How accurate is a 1RM calculator?" [ref=f12e442] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e443]: "03"
                - generic [aria-hidden] [ref=f12e445]: +
              - paragraph [ref=f12e446]: On compounds, a hard 2–8 is usually inside about 5%. Past 10 reps the equations measure endurance, not a max. Reynolds, Gordon, and Robergs 2006 found 5RM beat 10RM beat 20RM. Do not take an estimate into a meet.
            - generic [ref=f12e447]:
              - button "Is 5 reps about 85% of 1RM?" [ref=f12e448] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e449]: "04"
                - generic [aria-hidden] [ref=f12e451]: +
              - paragraph [ref=f12e452]: NSCA load charts put a 5RM near 87% of a tested 1RM. Epley from a 5-rep set treats that set as about 86% of the estimated max (100 / 116.7). Close enough to program from. Not close enough to skip a real opener.
            - generic [ref=f12e453]:
              - button "Can I use this as a bench press or squat max calculator?" [ref=f12e454] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e455]: "05"
                - generic [aria-hidden] [ref=f12e457]: +
              - paragraph [ref=f12e458]: "Yes. Same tool, same URL. Pick the lift if you want the deadlift caveat: published equations under-predict deadlift by about 10%. Formulas were mostly validated on bench, squat, and deadlift, not on curls."
            - generic [ref=f12e459]:
              - button "Should I test a true 1RM or estimate it?" [ref=f12e460] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e461]: "06"
                - generic [aria-hidden] [ref=f12e463]: +
              - paragraph [ref=f12e464]: Most lifters should estimate. A true single needs a spotter, safeties, and a reason. If you only need percentages for next week, a hard set of 3–5 plus Epley is enough. ACSM still treats a tested 1RM as the gold standard, not as homework.
            - generic [ref=f12e465]:
              - button "Does LIFTAG calculate 1RM automatically?" [ref=f12e466] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e467]: "07"
                - generic [aria-hidden] [ref=f12e469]: +
              - paragraph [ref=f12e470]: Yes. Log the set. Estimated 1RM updates per exercise with Epley, the same math as this page. PRs stay on the lift you actually performed. Optional RPE is context, not a second formula.
            - generic [ref=f12e471]:
              - button "What is the difference between a 1RM and a PR?" [ref=f12e472] [cursor=pointer]:
                - generic [aria-hidden] [ref=f12e473]: "08"
                - generic [aria-hidden] [ref=f12e475]: +
              - paragraph [ref=f12e476]: "1RM is a one-repetition maximum, a single. A PR is any personal record: a 5RM, a paused bench, a volume PR. This page estimates a 1RM. LIFTAG stores both."
