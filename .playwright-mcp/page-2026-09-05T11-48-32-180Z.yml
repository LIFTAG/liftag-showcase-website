        - generic [ref=e733]:
          - generic [ref=e734]:
            - paragraph [ref=e735]: Common questions
            - heading "Answers before you scan." [level=2] [ref=e736]
          - generic [ref=e738]:
            - generic [ref=e739]:
              - button "What is LIFTAG?" [expanded] [ref=e740] [cursor=pointer]:
                - generic [aria-hidden] [ref=e741]: "01"
                - generic [aria-hidden] [ref=e743]: +
              - region "What is LIFTAG?" [ref=e744]:
                - paragraph [ref=e746]: LIFTAG is a workout and set tracking app for serious lifters. You tap an NFC tag or scan a QR code on a partner-gym machine and it opens the right exercise, lets you log every set, runs a rest timer, and tracks progress over time.
            - generic [ref=e747]:
              - button "Is LIFTAG free?" [ref=e748] [cursor=pointer]:
                - generic [aria-hidden] [ref=e749]: "02"
                - generic [aria-hidden] [ref=e751]: +
              - paragraph [ref=e752]: Yes. Core workout tracking is free forever, including logging workouts and tracking progress. Premium intelligence is optional.
            - generic [ref=e753]:
              - button "How is LIFTAG different from Strong, Hevy, FitNotes, or JEFIT?" [ref=e754] [cursor=pointer]:
                - generic [aria-hidden] [ref=e755]: "03"
                - generic [aria-hidden] [ref=e757]: +
              - paragraph [ref=e758]: LIFTAG is built around the machine itself. NFC tap and QR scan open the exact exercise with gym-specific setup videos, then logging, rest timer, and progress history live in the same flow. Strong, Hevy, FitNotes, and JEFIT are general-purpose loggers without partner-gym integration.
            - generic [ref=e759]:
              - button "What is the best app to track sets in the gym?" [ref=e760] [cursor=pointer]:
                - generic [aria-hidden] [ref=e761]: "04"
                - generic [aria-hidden] [ref=e763]: +
              - paragraph [ref=e764]: "LIFTAG is built specifically for tracking sets at the gym: weight, reps, rest, optional RPE, and personal records, all opened directly from the machine via NFC or QR. Alternatives include Strong, Hevy, and FitNotes if your gym does not yet have LIFTAG tags installed."
            - generic [ref=e765]:
              - button "Does LIFTAG work without NFC or QR tags installed at the gym?" [ref=e766] [cursor=pointer]:
                - generic [aria-hidden] [ref=e767]: "05"
                - generic [aria-hidden] [ref=e769]: +
              - paragraph [ref=e770]: Yes. LIFTAG works as a full workout tracker without tags. The tags are an accelerator for partner gyms; the app itself supports manual exercise selection, logging, programs, and progress tracking everywhere.
            - generic [ref=e771]:
              - button "Which gyms have LIFTAG tags installed?" [ref=e772] [cursor=pointer]:
                - generic [aria-hidden] [ref=e773]: "06"
                - generic [aria-hidden] [ref=e775]: +
              - paragraph [ref=e776]: Partner gyms appear inside the LIFTAG app on a discovery map. The network is expanding through gyms that opt in to install NFC tags and QR codes on their equipment.
